<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" bgcolor="#ffffff" align="center" style="width:100%;max-width:600px;overflow-wrap:anywhere;word-break:break-word;background-color:#ffffff;font-size:15px;color:#1d2327;line-height:1.7;font-family:${FONT_FAMILY};">
    <!-- begin top-->
    <tr>
        <td bgcolor="${HEADER_COLOR}" style="background-color:${HEADER_COLOR};padding:18px 24px 20px 24px;color:${HEADER_TEXT_COLOR};" dir="auto">
            <div style="margin:0 0 8px 0;font-size:14px;font-weight:bold;color:${HEADER_TEXT_COLOR};font-family:${FONT_FAMILY};">${COMPANY_NAME}</div>
            <h1 style="margin:0;padding:0;font-size:22px;line-height:1.25;font-weight:bold;color:${HEADER_TEXT_COLOR};font-family:${FONT_FAMILY};">&{antibruteforce.accountLocked.email.header}</h1>
        </td>
    </tr>
    <!--end top-->

    <!--begin body-->
    <tr>
        <td bgcolor="#ffffff" style="background-color:#ffffff;border-bottom:1px solid #d8d8d8;border-left:1px solid #d8d8d8;border-right:1px solid #d8d8d8;padding:20px 24px;" dir="auto">
            <p style="margin:0 0 14px 0;" dir="auto">&{antibruteforce.accountLocked.email.hi} ${FIRST_NAME},</p>
            <p style="margin:0 0 14px 0;" dir="auto">&{antibruteforce.accountLocked.email.message}</p>
            <p style="margin:0 0 14px 0;" dir="auto">&{antibruteforce.accountLocked.email.linkDescription}:</p>
            <p style="margin:0 0 8px 0;" dir="auto">
                <a href="${FORGOT_PASSWORD_LINK}" style="color:${LINK_COLOR};font-weight:bold;text-decoration:underline;direction:ltr;unicode-bidi:embed;">${FORGOT_PASSWORD_LINK}</a>
            </p>
        </td>
    </tr>
    <!--end body-->

    <!-- begin footer-->
    <tr>
        <td style="padding:16px 24px;font-size:13px;line-height:1.6;color:#5d676d;" dir="auto">&{antibruteforce.accountLocked.email.footer}</td>
    </tr>
    <!--end footer-->
</table>
